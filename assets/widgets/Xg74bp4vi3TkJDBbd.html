const svg = document.getElementById('c');
const ns  = 'http://www.w3.org/2000/svg';
const VW=580, VH=280, M={t:18,r:90,b:50,l:48};
const PW=VW-M.l-M.r, PH=VH-M.t-M.b;
const YMIN=-0.72, YMAX=1.18;


const xp = a => M.l + a*PW;
const yp = v => M.t + (YMAX-v)/(YMAX-YMIN)*PH;


const mk = (tag,a,p) => {
  const e=document.createElementNS(ns,tag);
  Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));
  p&&p.appendChild(e); return e;
};
const linePath = (xs,ys) =>
  xs.map((a,i)=>(i?'L':'M')+xp(a).toFixed(1)+','+yp(ys[i]).toFixed(1)).join('');
const areaPath = (xs,lo,hi) => {
  const fwd=xs.map((a,i)=>xp(a).toFixed(1)+','+yp(hi[i]).toFixed(1)).join(' L ');
  const bwd=[...xs].map((_,j)=>{ const i=xs.length-1-j; return xp(xs[i]).toFixed(1)+','+yp(lo[i]).toFixed(1); }).join(' L ');
  return 'M '+fwd+' L '+bwd+' Z';
};
const path = (d,fill,stroke,sw,da,g) => mk('path',{d,fill:fill||'none',stroke:stroke||'none',
  'stroke-width':sw||1,'stroke-linejoin':'round','stroke-dasharray':da||'0'},g||svg);


function drawChrome() {
  path(`M ${xp(0)} ${yp(0)} L ${xp(1)} ${yp(0)} L ${xp(1)} ${yp(YMIN)} L ${xp(0)} ${yp(YMIN)} Z`,'rgba(0,0,0,0.03)');
  [1.0,0.5,0,-0.5].forEach(v=>{
    const yy=yp(v).toFixed(1);
    mk('line',{x1:M.l,y1:yy,x2:M.l+PW,y2:yy,stroke:v===0?'#888':'#e0e0e0',
      'stroke-width':v===0?1.5:1,'stroke-dasharray':v===0?'5,3':'0'},svg);
  });
  mk('line',{x1:M.l,y1:M.t,x2:M.l,y2:M.t+PH,stroke:'#ccc','stroke-width':1},svg);
  mk('line',{x1:M.l,y1:M.t+PH,x2:M.l+PW,y2:M.t+PH,stroke:'#ccc','stroke-width':1},svg);
  [0,0.25,0.5,0.75,1.0].forEach(a=>{
    const xx=xp(a);
    mk('line',{x1:xx,y1:M.t+PH,x2:xx,y2:M.t+PH+4,stroke:'#bbb','stroke-width':1},svg);
    mk('text',{x:xx,y:M.t+PH+14,'text-anchor':'middle','font-size':10.5,fill:'#777'},svg
      ).textContent=a===0?'α=0':a===1?'α=1':String(a);
  });
  mk('text',{x:M.l+PW/2,y:VH-6,'text-anchor':'middle','font-size':9.5,fill:'#aaa'},svg
    ).textContent='correct tool ————————————— wrong tool';
  [-0.5,0,0.5,1.0].forEach(v=>{
    const yy=yp(v);
    mk('line',{x1:M.l-4,y1:yy,x2:M.l,y2:yy,stroke:'#bbb','stroke-width':1},svg);
    mk('text',{x:M.l-7,y:yy,'text-anchor':'end','dominant-baseline':'middle','font-size':10,fill:'#777'},svg
      ).textContent=v.toFixed(1);
  });
  mk('text',{x:12,y:M.t+PH/2,'text-anchor':'middle','font-size':10,fill:'#999',
    transform:`rotate(-90,12,${M.t+PH/2})`},svg).textContent='diff(α) / diff(0)';
  mk('text',{x:M.l+4,y:yp(0)-8,'text-anchor':'start','font-size':9,fill:'#999'},svg).textContent='diff = 0';
}


let dataGroup=null;
let currentTab='orig';


function drawData(tab) {
  if (dataGroup) dataGroup.remove();
  dataGroup=mk('g',{},svg);
  const g=dataGroup;
  const pp=v=>path(v.d,v.fill,v.stroke,v.sw,v.da,g);


  if (tab==='orig') {
    // IQR bands
    path(areaPath(A,D.OMpTay.q25,D.OMpTay.q75),'rgba(199,119,0,0.08)',null,0,null,g);
    path(areaPath(A,D.OMrTay.q25,D.OMrTay.q75),'rgba(30,142,62,0.07)',null,0,null,g);
    path(areaPath(A,D.OMpT.q25,D.OMpT.q75),'rgba(199,119,0,0.16)',null,0,null,g);
    path(areaPath(A,D.OMrT.q25,D.OMrT.q75),'rgba(30,142,62,0.13)',null,0,null,g);
    // Taylor (dashed)
    path(linePath(A,D.OMpTay.med),'none','#c77700',1.5,'5,3',g);
    path(linePath(A,D.OMrTay.med),'none','#1e8e3e',1.5,'5,3',g);
    // True (solid)
    path(linePath(A,D.OMpT.med),'none','#c77700',2.5,'0',g);
    path(linePath(A,D.OMrT.med),'none','#1e8e3e',2.5,'0',g);
  } else {
    // IQR bands
    path(areaPath(A,D.PTayF.q25,D.PTayF.q75),'rgba(199,119,0,0.07)',null,0,null,g);
    path(areaPath(A,D.RTayF.q25,D.RTayF.q75),'rgba(30,142,62,0.06)',null,0,null,g);
    path(areaPath(A,D.PF.q25,D.PF.q75),'rgba(199,119,0,0.11)',null,0,null,g);
    path(areaPath(A,D.RF.q25,D.RF.q75),'rgba(30,142,62,0.09)',null,0,null,g);
    path(areaPath(A,D.PT.q25,D.PT.q75),'rgba(199,119,0,0.16)',null,0,null,g);
    path(areaPath(A,D.RT.q25,D.RT.q75),'rgba(30,142,62,0.13)',null,0,null,g);
    // Taylor frozen (dashed)
    path(linePath(A,D.PTayF.med),'none','#c77700',1.5,'5,3',g);
    path(linePath(A,D.RTayF.med),'none','#1e8e3e',1.5,'5,3',g);
    // Frozen circuit (dash-dot)
    path(linePath(A,D.PF.med),'none','#c77700',1.8,'6,2,1,2',g);
    path(linePath(A,D.RF.med),'none','#1e8e3e',1.8,'6,2,1,2',g);
    // True (solid)
    path(linePath(A,D.PT.med),'none','#c77700',2.5,'0',g);
    path(linePath(A,D.RT.med),'none','#1e8e3e',2.5,'0',g);
  }


  // End labels (true curve of active tab)
  const trueP = tab==='orig' ? D.OMpT : D.PT;
  const trueR = tab==='orig' ? D.OMrT : D.RT;
  const lx=M.l+PW+6;
  mk('text',{x:lx,y:yp(trueR.med[40]),'font-size':11,fill:'#1e8e3e','dominant-baseline':'middle'},g).textContent='Recover';
  mk('text',{x:lx,y:yp(trueR.med[40])+12,'font-size':9,fill:'#1e8e3e','dominant-baseline':'middle',opacity:0.75},g).textContent='≈ '+trueR.med[40].toFixed(2);
  mk('text',{x:lx,y:yp(trueP.med[40]),'font-size':11,fill:'#c77700','dominant-baseline':'middle'},g).textContent='Parrot';
  mk('text',{x:lx,y:yp(trueP.med[40])+12,'font-size':9,fill:'#c77700','dominant-baseline':'middle',opacity:0.75},g).textContent='≈ '+trueP.med[40].toFixed(2);


  // Crossing annotation
  mk('circle',{cx:xp(0.65),cy:yp(0),r:4,fill:'#c77700',stroke:'white','stroke-width':1.5},g);
  mk('text',{x:xp(0.65)-6,y:yp(0)-11,'text-anchor':'end','font-size':9.5,fill:'#c77700'},g).textContent='crosses zero';
}


const overlay=mk('rect',{x:M.l,y:M.t,width:PW,height:PH,fill:'transparent',cursor:'crosshair'},svg);
const vl=mk('line',{x1:0,x2:0,y1:M.t,y2:M.t+PH,stroke:'#888','stroke-width':1,'stroke-dasharray':'3,2',visibility:'hidden'},svg);
const tip=document.getElementById('tip');


overlay.addEventListener('mousemove',e=>{
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(VW/r.width);
  const ai=Math.max(0,Math.min(40,Math.round(((mx-M.l)/PW)*40)));
  const a=A[ai];
  vl.setAttribute('x1',xp(a)); vl.setAttribute('x2',xp(a));
  vl.setAttribute('visibility','visible');
  tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-210)+'px';
  tip.style.top=(e.clientY-r.top-50)+'px';
  const fmt=v=>(v==null||isNaN(v))?'—':v.toFixed(3);
  if (currentTab==='orig') {
    tip.innerHTML=`<strong>α = ${a.toFixed(3)}</strong><br>`+
      `<span style="color:#1e8e3e">● Recover</span>  `+
      `true <b>${fmt(D.RT.med[ai])}</b> [${fmt(D.RT.q25[ai])}, ${fmt(D.RT.q75[ai])}]  `+
      `tay <b>${fmt(D.RTay.med[ai])}</b><br>`+
      `<span style="color:#c77700">● Parrot  </span>  `+
      `true <b>${fmt(D.PT.med[ai])}</b> [${fmt(D.PT.q25[ai])}, ${fmt(D.PT.q75[ai])}]  `+
      `tay <b>${fmt(D.PTay.med[ai])}</b>`;
  } else {
    tip.innerHTML=`<strong>α = ${a.toFixed(3)}</strong><br>`+
      `<span style="color:#1e8e3e">● Recover</span>  `+
      `true <b>${fmt(D.RT.med[ai])}</b>  `+
      `frz <b>${fmt(D.RF.med[ai])}</b> [${fmt(D.RF.q25[ai])}, ${fmt(D.RF.q75[ai])}]  `+
      `tay <b>${fmt(D.RTayF.med[ai])}</b><br>`+
      `<span style="color:#c77700">● Parrot  </span>  `+
      `true <b>${fmt(D.PT.med[ai])}</b>  `+
      `frz <b>${fmt(D.PF.med[ai])}</b> [${fmt(D.PF.q25[ai])}, ${fmt(D.PF.q75[ai])}]  `+
      `tay <b>${fmt(D.PTayF.med[ai])}</b>`;
  }
});
overlay.addEventListener('mouseleave',()=>{
  vl.setAttribute('visibility','hidden'); tip.style.opacity=0;
});


function switchTab(tab) {
  currentTab=tab;
  document.getElementById('btn-orig').classList.toggle('active',tab==='orig');
  document.getElementById('btn-repl').classList.toggle('active',tab==='repl');
  document.getElementById('legend-orig').style.display=tab==='orig'?'flex':'none';
  document.getElementById('legend-repl').style.display=tab==='repl'?'flex':'none';
  drawData(tab);
  svg.appendChild(overlay);
  svg.appendChild(vl);
}

svg.appendChild(overlay);
svg.appendChild(vl);
