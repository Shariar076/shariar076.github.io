<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; }
  .box {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 100%; box-sizing: border-box;
    border: 1px solid #d8d8d8; border-radius: 8px;
    padding: 1rem 1.1rem; background: #fafafa; color: #1a1a1a;
  }
  .box-accent { border-left: 4px solid #1e8e3e; }
  .box-label {
    font-size: 0.80rem; letter-spacing: 0.04em;
    color: #6b6b6b; margin-bottom: 0.9rem; font-weight: 600;
  }
  .stat-row {
    display: flex; flex-wrap: wrap; gap: 1rem;
  }
  .stat-block {
    flex: 1 1 8rem; text-align: center;
    padding: 0.75rem 0.5rem;
    background: #fff; border: 1px solid #ececec; border-radius: 6px;
  }
  .stat-n {
    font-size: 2rem; font-weight: 700; line-height: 1;
    color: #1a1a1a; font-variant-numeric: tabular-nums;
  }
  .stat-desc {
    margin-top: 0.4rem; font-size: 0.8rem; color: #6b6b6b; line-height: 1.3;
  }
</style>

<div class="box box-accent">
  <div class="box-label">Dataset</div>
  <div class="stat-row">
    <div class="stat-block">
      <div class="stat-n">292</div>
      <div class="stat-desc">consistent cases retained</div>
    </div>
    <div class="stat-block">
      <div class="stat-n">130</div>
      <div class="stat-desc">always-parrot</div>
    </div>
    <div class="stat-block">
      <div class="stat-n">162</div>
      <div class="stat-desc">always-recover</div>
    </div>
  </div>
</div>
