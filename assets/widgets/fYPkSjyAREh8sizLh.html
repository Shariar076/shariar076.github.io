<!doctype html>
<meta charset="utf-8">

<style>
  html, body { margin: 0; }
  .eq {
    box-sizing: border-box; max-width: 100%;
    background: transparent; border: 1px solid #d8d8d8; border-radius: 8px;
    padding: 1rem 1.1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem; line-height: 1.5; overflow-x: auto; color: inherit;
  }
  .eq .comment { color: #6b6b6b; font-style: italic; }
</style>

<div class="eq">
  emb(α) = α · emb(wrong_token) + (1 − α) · emb(correct_token)<br>
  <br>
  diff(α) = L<sub>correct</sub>(α) − L<sub>wrong</sub>(α)
  <span class="comment">   ← logit difference at the commit position</span>
</div>
