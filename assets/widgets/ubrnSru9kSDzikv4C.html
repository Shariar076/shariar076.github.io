<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; }
  .box {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 100%; box-sizing: border-box;
    border: 1px solid #d8d8d8; border-radius: 8px;
    padding: 1rem 1.1rem; background: #fafafa; color: #1a1a1a;
  }
  .box-amber { border-left: 4px solid #c77700; }
  .box-label {
    font-size: 0.80rem; letter-spacing: 0.04em;
    color: #6b6b6b; margin-bottom: 0.9rem; font-weight: 600;
  }
  .stat-row { display: flex; flex-wrap: wrap; gap: 1rem; }
  .stat-block {
    flex: 1 1 8rem; text-align: center;
    padding: 0.75rem 0.5rem;
    background: #fff; border: 1px solid #ececec; border-radius: 6px;
  }
  .stat-n {
    font-size: 2rem; font-weight: 700; line-height: 1;
    color: #1a1a1a; font-variant-numeric: tabular-nums;
  }
  .stat-desc { margin-top: 0.4rem; font-size: 0.8rem; color: #6b6b6b; line-height: 1.3; }
  .box p {
    margin: 1rem 0 0; font-size: 0.85rem; line-height: 1.5; color: #444;
  }
  .shaded {
    margin: 1rem 0 0; padding: 1rem 1.25rem;
    background: linear-gradient(135deg, #ecebe8, #d6d4cf);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    color: #2b2b2b; font-size: 0.9rem; line-height: 1.55;
  }
</style>

<div class="box box-amber">
  <div class="box-label">Circuit Oracle: correct-tool graphs, 42 cases</div>
  <div class="stat-row">
    <div class="stat-block">
      <div class="stat-n">50%</div>
      <div class="stat-desc">overall: 21 / 42</div>
    </div>
    <div class="stat-block">
      <div class="stat-n">95%</div>
      <div class="stat-desc">parrot correct: 20 / 21</div>
    </div>
    <div class="stat-block">
      <div class="stat-n">5%</div>
      <div class="stat-desc">recover correct: 1 / 21</div>
    </div>
  </div>
  <p class="shaded">
    Majority-class baseline (predict recover everywhere): <strong>55.5%</strong>.
    The oracle is <em>below</em> the majority-class baseline.
  </p>
</div>
